[package]
name = "sgos"
version = "1.3.1"
description = "SGOS — My Personal Operating System"
authors = ["soughoumouad1"]
license = "MIT"
repository = "https://github.com/soughoumouad1/sgos"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
